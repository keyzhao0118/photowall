<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>照片墙 · PhotoWall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root { --accent: #ff6b9d; --accent2: #7b5cff; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 100%; height: 100%; overflow: hidden; background: #06060f; }

  body {
    font-family: 'ZCOOL KuaiLe', 'YouYuan', '幼圆', 'Microsoft YaHei', sans-serif;
    user-select: none; -webkit-user-select: none;
    cursor: grab; color: #fff;
  }
  body.dragging { cursor: grabbing; }

  #stage { position: fixed; inset: 0; z-index: 1; display: block; }

  #glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60vw 60vw at 20% 15%, rgba(123,92,255,0.18), transparent 60%),
      radial-gradient(55vw 55vw at 82% 78%, rgba(255,107,157,0.16), transparent 62%),
      radial-gradient(40vw 40vw at 60% 45%, rgba(64,196,255,0.10), transparent 65%),
      #06060f;
    animation: breathe 18s ease-in-out infinite alternate;
  }
  @keyframes breathe {
    0%   { filter: hue-rotate(0deg) brightness(1); }
    100% { filter: hue-rotate(28deg) brightness(1.18); }
  }

  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; padding: 16px 22px;
    background: linear-gradient(180deg, rgba(6,6,15,0.92) 55%, rgba(6,6,15,0));
    transition: opacity .8s ease, transform .8s ease;
  }
  #topbar.hidden { opacity: 0; transform: translateY(-18px); pointer-events: none; }

  #brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 26px; letter-spacing: 3px;
    text-shadow: 0 0 18px rgba(255,107,157,.75), 0 0 52px rgba(255,107,157,.35);
    white-space: nowrap;
  }
  #brand .dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 14px var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.7); } }

  #actions { display: flex; align-items: center; gap: 10px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px;
    border: 1.5px solid rgba(255,255,255,.24);
    border-radius: 999px;
    background: rgba(255,255,255,.07); color: #fff;
    font-family: inherit; font-size: 15px; cursor: pointer;
    backdrop-filter: blur(12px);
    transition: background .25s, border-color .25s, box-shadow .25s, transform .15s;
    white-space: nowrap;
  }
  .btn:hover {
    background: rgba(255,255,255,.16);
    border-color: rgba(255,107,157,.7);
    box-shadow: 0 0 26px rgba(255,107,157,.35);
  }
  .btn:active { transform: scale(.96); }
  .btn.icon { padding: 10px 13px; font-size: 17px; }

  #dirName {
    max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    opacity: .85; font-size: 13.5px;
  }

  #restore {
    position: fixed; left: 50%; top: 84px; transform: translate(-50%, -14px);
    z-index: 30; display: none; align-items: center; gap: 14px;
    padding: 12px 18px; border-radius: 999px;
    background: rgba(20,20,40,.9);
    border: 1.5px solid rgba(255,107,157,.5);
    box-shadow: 0 10px 40px rgba(0,0,0,.55), 0 0 34px rgba(255,107,157,.22);
    backdrop-filter: blur(14px);
    opacity: 0; transition: opacity .4s, transform .4s;
  }
  #restore.show { display: flex; opacity: 1; transform: translate(-50%, 0); }
  #restore span { font-size: 14.5px; }
  #restore b { color: var(--accent); }
  #restore .btn { padding: 7px 16px; font-size: 14px; }

  #hint {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    z-index: 20; font-size: 14.5px; letter-spacing: 1.5px;
    color: rgba(255,255,255,.5); text-shadow: 0 2px 12px rgba(0,0,0,.8);
    transition: opacity 1.6s ease;
    pointer-events: none; text-align: center; line-height: 1.7;
  }
  #hint.fade { opacity: 0; }

  #viewer {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: rgba(3,3,10,.86); backdrop-filter: blur(18px);
    opacity: 0; pointer-events: none; transition: opacity .35s ease;
  }
  #viewer.open { opacity: 1; pointer-events: auto; }

  #card {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    padding: 26px 30px 30px; border-radius: 30px;
    background: linear-gradient(160deg, rgba(38,38,66,.96), rgba(18,18,36,.97));
    border: 1.5px solid rgba(255,255,255,.14);
    box-shadow: 0 30px 90px rgba(0,0,0,.7), 0 0 100px rgba(255,107,157,.14);
    transform: scale(.88) translateY(14px);
    transition: transform .42s cubic-bezier(.2,.9,.3,1.35);
    max-width: 92vw; max-height: 92vh;
  }
  #viewer.open #card { transform: scale(1) translateY(0); }

  #closeBtn {
    position: absolute; top: 14px; right: 16px;
    width: 40px; height: 40px; border-radius: 50%;
    border: none; cursor: pointer;
    background: rgba(255,255,255,.1); color: #fff;
    font-size: 21px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background .25s, transform .2s;
  }
  #closeBtn:hover { background: rgba(255,70,90,.55); transform: rotate(90deg); }

  #bigWrap {
    position: relative; border-radius: 22px; overflow: hidden;
    box-shadow: 0 16px 60px rgba(0,0,0,.55); flex-shrink: 0;
  }
  #bigImg {
    display: block; max-width: min(62vw, 620px); max-height: 54vh;
    object-fit: contain; background: #101024;
  }

  #bigName {
    font-size: 38px; letter-spacing: 4px; line-height: 1.2;
    text-shadow: 0 0 24px rgba(255,200,120,.55), 0 4px 18px rgba(0,0,0,.7);
  }

  #likeRow { display: flex; align-items: center; gap: 16px; }

  #likeBtn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 34px; border: none; border-radius: 999px; cursor: pointer;
    font-family: inherit; font-size: 19px; color: #fff;
    background: linear-gradient(135deg, #ff6b9d, #ff2d78);
    box-shadow: 0 8px 30px rgba(255,45,120,.45);
    transition: transform .2s, box-shadow .25s;
  }
  #likeBtn:hover { transform: translateY(-2px) scale(1.045); box-shadow: 0 12px 40px rgba(255,45,120,.62); }
  #likeBtn:active { transform: scale(.95); }
  #likeBtn.on {
    background: linear-gradient(135deg, #7b5cff, #5a3ce0);
    box-shadow: 0 8px 30px rgba(123,92,255,.5);
  }
  #likeBtn .heart { font-size: 22px; display: inline-block; }
  #likeBtn.on .heart { animation: beat .9s ease-in-out infinite; }
  @keyframes beat { 0%,100% { transform: scale(1); } 45% { transform: scale(1.32); } }

  #likeNum {
    font-size: 22px; min-width: 92px; text-align: center;
    color: #ffd0e0; text-shadow: 0 0 20px rgba(255,107,157,.6);
  }

  .floaty {
    position: fixed; z-index: 200; pointer-events: none;
    font-size: 26px; will-change: transform, opacity;
    animation: floatUp 1.25s cubic-bezier(.2,.7,.4,1) forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translate(0,0) scale(.5) rotate(0deg); }
    18%  { opacity: 1; transform: translate(0,-16px) scale(1.25) rotate(8deg); }
    100% { opacity: 0; transform: translate(var(--dx), -190px) scale(.75) rotate(var(--rot)); }
  }

  #empty {
    position: fixed; inset: 0; z-index: 50;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 30px; text-align: center; line-height: 2;
    background: rgba(6,6,15,.9);
  }
  #empty.show { display: flex; }
  #empty h2 { font-size: 26px; letter-spacing: 2px; }
  #empty p { font-size: 15px; color: rgba(255,255,255,.66); max-width: 640px; }
  #empty code {
    font-family: Consolas, monospace; font-size: 13.5px;
    background: rgba(255,255,255,.1); padding: 3px 9px; border-radius: 7px; color: #ffd0e0;
  }

  @media (max-width: 760px) {
    #brand { font-size: 19px; letter-spacing: 1px; }
    .btn { padding: 8px 14px; font-size: 13px; }
    #dirName { display: none; }
    #bigName { font-size: 26px; }
    #bigImg { max-width: 84vw; max-height: 44vh; }
    #likeBtn { padding: 11px 22px; font-size: 16px; }
    #likeNum { font-size: 18px; min-width: 70px; }
    #hint { font-size: 12px; }
  }
</style>
</head>
<body>

<div id="glow"></div>
<canvas id="stage"></canvas>

<div id="topbar">
  <div id="brand"><span class="dot"></span>照片墙</div>
  <div id="actions">
    <button class="btn" id="pickBtn">📁 <span>选择照片目录</span></button>
    <span id="dirName"></span>
    <button class="btn icon" id="fullBtn" title="全屏 (F)">⛶</button>
  </div>
</div>

<div id="restore">
  <span>检测到上次使用的目录 <b id="restoreName"></b></span>
  <button class="btn" id="restoreBtn">点击恢复</button>
  <button class="btn icon" id="restoreNo" title="忽略">✕</button>
</div>

<div id="empty">
  <h2>📂 这个目录里没有找到照片</h2>
  <p>
    请确认目录中包含图片文件（<code>.jpg</code> <code>.png</code> <code>.gif</code> <code>.webp</code> <code>.bmp</code> <code>.avif</code>）。<br>
    文件名就是展示的姓名，例如 <code>张可爱.jpg</code> 会显示为「张可爱」。
  </p>
  <button class="btn" id="emptyPick">重新选择目录</button>
</div>

<div id="hint">
  🖱️ 拖拽搅动水流 &nbsp;·&nbsp; 点击水面激起波纹 &nbsp;·&nbsp; 单击照片放大点赞
</div>

<div id="viewer">
  <div id="card">
    <button id="closeBtn" title="关闭 (Esc)">✕</button>
    <div id="bigWrap"><img id="bigImg" alt=""></div>
    <div id="bigName"></div>
    <div id="likeRow">
      <button id="likeBtn"><span class="heart">🤍</span><span id="likeLabel">点赞</span></button>
      <div id="likeNum">0</div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   照片墙 PhotoWall
   - 蜂窝状(六边形)环形排布，Apple Watch 风格
   - 无操作时持续随机流动；拖拽鼠标控制流动方向
   - 单击照片放大查看 + 点赞，数据写入照片目录内 photowall-likes.json
   - 目录句柄存入 IndexedDB，宣传屏重启后可一键恢复
   ===================================================================== */

var LIKES_FILE = 'photowall-likes.json';
var IMG_EXTS = ['.jpg', '.jpeg', '.png', '.gif', '.webp', '.bmp', '.avif'];
var DB_NAME = 'photowall-db';
var DB_STORE = 'handles';
var DB_KEY = 'photoDir';
var HEART_EMOJI = ['❤️', '💖', '💕', '💗', '💝', '✨', '🌟', '💞'];

var canvas = document.getElementById('stage');
var ctx = canvas.getContext('2d');
var topbar = document.getElementById('topbar');
var pickBtn = document.getElementById('pickBtn');
var fullBtn = document.getElementById('fullBtn');
var dirName = document.getElementById('dirName');
var restoreBar = document.getElementById('restore');
var restoreName = document.getElementById('restoreName');
var restoreBtn = document.getElementById('restoreBtn');
var restoreNo = document.getElementById('restoreNo');
var emptyBox = document.getElementById('empty');
var emptyPick = document.getElementById('emptyPick');
var hint = document.getElementById('hint');
var viewer = document.getElementById('viewer');
var closeBtn = document.getElementById('closeBtn');
var bigImg = document.getElementById('bigImg');
var bigName = document.getElementById('bigName');
var likeBtn = document.getElementById('likeBtn');
var likeLabel = document.getElementById('likeLabel');
var likeNum = document.getElementById('likeNum');

/* ---------- 水流物理参数 ---------- */
var FLOW_STRENGTH = 0.062;   /* 水流推力 */
var FLOW_SCALE    = 0.0021;  /* 流场空间频率 */
var FREE_RADIUS   = 24;      /* 牵引绳松弛半径：此范围内完全自由 */
var SPRING_K      = 0.0022;  /* 牵引绳刚度（越小越散） */
var SEP_K         = 0.62;    /* 照片互斥强度 */
var DRAG          = 0.957;   /* 水的阻尼 */
var MAXV          = 7.5;     /* 单帧速度上限，防爆 */
var CURSOR_R      = 175;     /* 光标拨水半径 */
var CURSOR_K      = 1.9;     /* 光标拨水力度 */
var RIPPLE_SPEED  = 11;      /* 波纹扩散速度 */
var RIPPLE_BAND   = 48;      /* 波纹作用带宽 */
var RIPPLE_POWER  = 5.6;     /* 波纹冲力 */

var photos = [];
var clusterR = 0;
/* 已废弃：照片不再锁定在格点上，改为独立物理个体 */
var cellSize = 110;
var spacing = 132;
var viewX = 0, viewY = 0;
var velX = 0, velY = 0;
var goalX = 0, goalY = 0;
var wanderA = Math.random() * Math.PI * 2;
var ripples = [];
var cursorX = -9999, cursorY = -9999;
var cursorIn = false;
var lastTrailT = 0;
var currentX = 0, currentY = 0;   /* 拖拽激起的整体水流 */
var mouseDown = false;
var dragVX = 0, dragVY = 0;
var downX = 0, downY = 0;
var lastX = 0, lastY = 0;
var lastT = 0;
var hoverIdx = -1;
var openIdx = -1;
var liked = {};
var dirHandle = null;
var pendingHandle = null;
var likesCache = {};
var sprites = new Map();
var idleTimer = null;
var uiHidden = false;
var ready = false;

function W() { return window.innerWidth; }
function H() { return window.innerHeight; }

function resize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(W() * dpr);
  canvas.height = Math.floor(H() * dpr);
  canvas.style.width = W() + 'px';
  canvas.style.height = H() + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sprites.clear();
  recomputeLayout();
}
window.addEventListener('resize', function () { resize(); });

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

function fitText(g, text, maxW) {
  if (g.measureText(text).width <= maxW) return text;
  var t = text;
  while (t.length > 1 && g.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}

function baseName(filename) {
  var i = filename.lastIndexOf('.');
  return i > 0 ? filename.slice(0, i) : filename;
}

function isImage(name) {
  var low = name.toLowerCase();
  for (var i = 0; i < IMG_EXTS.length; i++) {
    if (low.endsWith(IMG_EXTS[i])) return true;
  }
  return false;
}

/* ---------- 蜂窝几何：轴向六边形坐标 + 环形螺旋 ---------- */
function hexRings(rings) {
  var cells = [[0, 0]];
  var dirs = [[-1, 1], [-1, 0], [0, -1], [1, -1], [1, 0], [0, 1]];
  for (var n = 1; n <= rings; n++) {
    var q = n, r = 0;
    for (var d = 0; d < 6; d++) {
      for (var i = 0; i < n; i++) {
        cells.push([q, r]);
        q += dirs[d][0];
        r += dirs[d][1];
      }
    }
  }
  return cells;
}

/* 用六边形给出「锚点」，再叠加随机抖动打散格点感 */
function recomputeLayout() {
  var n = photos.length;
  clusterR = 0;
  if (n === 0) return;

  var rings = 0;
  while (1 + 3 * rings * (rings + 1) < n) rings++;

  var minDim = Math.min(W(), H());
  var want = minDim * 0.40;
  var s = want / Math.max(rings, 0.85);
  s = clamp(s, 104, 208);
  spacing = s;
  cellSize = Math.round(s * 0.78);
  SEP_RADIUS = cellSize * 1.22;

  var cells = hexRings(rings);
  for (var k = 0; k < n; k++) {
    var p = photos[k];
    var c = cells[k];
    var bx = spacing * (c[0] + c[1] * 0.5);
    var by = spacing * 0.8660254 * c[1];

    /* 锚点 = 六边形位置 + 随机抖动，彻底打散网格感 */
    if (p.hx === undefined) {
      p.hx = bx + (Math.random() - 0.5) * spacing * 0.40;
      p.hy = by + (Math.random() - 0.5) * spacing * 0.40;
      p.x = p.hx;
      p.y = p.hy;
      p.vx = 0;
      p.vy = 0;
      p.ph = Math.random() * Math.PI * 2;
      p.ph2 = Math.random() * Math.PI * 2;
      p.rotBase = (Math.random() - 0.5) * 0.16;
      p.rotAmp = 0.035 + Math.random() * 0.075;
      p.rotSpd = 0.28 + Math.random() * 0.5;
      p.rotPh = Math.random() * Math.PI * 2;
      p.spin = 0;
      p.rot = p.rotBase;
      p.pulsePh = Math.random() * Math.PI * 2;
    } else {
      /* 尺寸变化时锚点按比例缩放，位置平滑过渡 */
      var ratio = s / (p._lastSpacing || s);
      p.hx *= ratio;
      p.hy *= ratio;
      p.x *= ratio;
      p.y *= ratio;
    }
    p._lastSpacing = s;
  }

  /* 锚点松弛：抖动可能让相邻锚点挤在一起，用几轮互斥迭代推开。
     结果既是有机的散布，又保证任意两张照片不重叠。 */
  relaxAnchors(Math.max(cellSize * 1.16, spacing * 0.90), 64);

  for (var m = 0; m < n; m++) {
    var q = photos[m];
    var dist = Math.sqrt(q.hx * q.hx + q.hy * q.hy);
    if (dist > clusterR) clusterR = dist;
  }
  sprites.clear();
}

/* 迭代式互斥松弛：把靠得太近的锚点推开，得到自然又不重叠的初始散布 */
function relaxAnchors(minDist, iterations) {
  var n = photos.length;
  if (n < 2) return;
  var minD2 = minDist * minDist;
  for (var it = 0; it < iterations; it++) {
    for (var i = 0; i < n; i++) {
      var a = photos[i];
      for (var j = i + 1; j < n; j++) {
        var b = photos[j];
        var dx = a.hx - b.hx;
        var dy = a.hy - b.hy;
        var d2 = dx * dx + dy * dy;
        if (d2 >= minD2 || d2 < 0.0001) continue;
        var d = Math.sqrt(d2);
        var push = (minDist - d) * 0.5;
        var nx = dx / d;
        var ny = dy / d;
        a.hx += nx * push; a.hy += ny * push;
        b.hx -= nx * push; b.hy -= ny * push;
      }
    }
  }
}

/* ---------- 精灵图预渲染 ---------- */
function makeSprite(photo) {
  var key = photo.id + '@' + cellSize;
  var hit = sprites.get(key);
  if (hit) return hit;
  if (!photo.img || !photo.img.complete || photo.img.naturalWidth === 0) return null;

  var pad = 16;
  var side = cellSize + pad * 2;
  var cv = document.createElement('canvas');
  cv.width = side;
  cv.height = side;
  var g = cv.getContext('2d');
  var cx = side / 2, cy = side / 2, r = cellSize / 2;

  g.beginPath();
  g.arc(cx, cy, r + 5, 0, Math.PI * 2);
  g.fillStyle = 'rgba(255,255,255,0.07)';
  g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.20)';
  g.lineWidth = 1.6;
  g.stroke();

  g.save();
  g.beginPath();
  g.arc(cx, cy, r, 0, Math.PI * 2);
  g.clip();

  var img = photo.img;
  var sc = Math.max((r * 2) / img.naturalWidth, (r * 2) / img.naturalHeight);
  var dw = img.naturalWidth * sc;
  var dh = img.naturalHeight * sc;
  g.drawImage(img, cx - dw / 2, cy - dh / 2, dw, dh);

  var grd = g.createLinearGradient(0, cy + r * 0.08, 0, cy + r);
  grd.addColorStop(0, 'rgba(0,0,0,0)');
  grd.addColorStop(1, 'rgba(0,0,0,0.78)');
  g.fillStyle = grd;
  g.fillRect(cx - r, cy + r * 0.08, r * 2, r * 0.92);

  var grd2 = g.createLinearGradient(0, cy - r, 0, cy - r * 0.35);
  grd2.addColorStop(0, 'rgba(255,255,255,0.20)');
  grd2.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd2;
  g.fillRect(cx - r, cy - r, r * 2, r * 0.65);
  g.restore();

  var fs = Math.max(12, Math.round(cellSize * 0.145));
  g.font = 'bold ' + fs + 'px "ZCOOL KuaiLe", "YouYuan", "幼圆", "Microsoft YaHei", sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.shadowColor = 'rgba(0,0,0,0.95)';
  g.shadowBlur = 5;
  g.fillStyle = '#ffffff';
  g.fillText(fitText(g, photo.name, cellSize - 14), cx, cy + r - fs * 1.0);
  g.shadowBlur = 0;

  g.beginPath();
  g.arc(cx, cy, r, 0, Math.PI * 2);
  g.strokeStyle = 'rgba(255,255,255,0.42)';
  g.lineWidth = 2.4;
  g.stroke();

  g.beginPath();
  g.arc(cx, cy, r - 1.6, 0, Math.PI * 2);
  g.strokeStyle = 'rgba(0,0,0,0.25)';
  g.lineWidth = 1.2;
  g.stroke();

  sprites.set(key, cv);
  return cv;
}

/* ---------- 水流物理引擎 ---------- */
var SEP_RADIUS = 130;

/* 平滑时空流场：多个正弦叠加，产生类似水下暗流的连续推力 */
function flowAt(x, y, t, ph) {
  var k = FLOW_SCALE;
  var fx = Math.sin(y * k + t * 0.55 + ph) +
           0.55 * Math.sin((y + x * 0.62) * k * 1.7 - t * 0.34 + ph * 0.6) +
           0.28 * Math.cos((x - y) * k * 0.8 + t * 0.22);
  var fy = Math.cos(x * k + t * 0.47 + ph * 1.3) +
           0.55 * Math.cos((x - y * 0.72) * k * 1.6 + t * 0.29 + ph * 0.9) +
           0.28 * Math.sin((x + y) * k * 0.85 - t * 0.26);
  return { x: fx, y: fy };
}

function physics(dt, t) {
  var n = photos.length;
  if (n === 0) return;

  /* 光标换算到世界坐标 */
  var cwx = cursorX - W() / 2 - viewX;
  var cwy = cursorY - H() / 2 - viewY;
  var cR2 = CURSOR_R * CURSOR_R;

  var i, j, p, q, dx, dy, d2, d;

  /* ---- 第一遍：水流 + 牵引绳 + 光标拨水 ---- */
  for (i = 0; i < n; i++) {
    p = photos[i];

    var f = flowAt(p.x, p.y, t, p.ph);
    p.vx += f.x * FLOW_STRENGTH * dt;
    p.vy += f.y * FLOW_STRENGTH * dt;

    /* 拖拽激起的整体水流，像用手推一整片水 */
    p.vx += currentX * dt;
    p.vy += currentY * dt;

    /* 牵引绳：超出松弛半径才回拉，半径内完全自由 */
    dx = p.hx - p.x;
    dy = p.hy - p.y;
    d = Math.sqrt(dx * dx + dy * dy);
    if (d > FREE_RADIUS) {
      var pull = (d - FREE_RADIUS) * SPRING_K;
      p.vx += (dx / d) * pull * dt;
      p.vy += (dy / d) * pull * dt;
    }

    /* 光标像手指拨水，把照片轻轻推开 */
    if (cursorIn) {
      dx = p.x - cwx;
      dy = p.y - cwy;
      d2 = dx * dx + dy * dy;
      if (d2 < cR2 && d2 > 1) {
        d = Math.sqrt(d2);
        var cf = (1 - d / CURSOR_R) * CURSOR_K;
        p.vx += (dx / d) * cf * dt;
        p.vy += (dy / d) * cf * dt;
        p.spin += (dx / d) * cf * 0.0016 * dt;
      }
    }
  }

  /* ---- 第二遍：照片互斥（空间哈希，O(n) 近似） ---- */
  var grid = new Map();
  var cs = SEP_RADIUS;
  for (i = 0; i < n; i++) {
    p = photos[i];
    var gx = Math.floor(p.x / cs);
    var gy = Math.floor(p.y / cs);
    var key = gx + ',' + gy;
    var bucket = grid.get(key);
    if (!bucket) { bucket = []; grid.set(key, bucket); }
    bucket.push(i);
  }

  var SEP2 = SEP_RADIUS * SEP_RADIUS;
  for (i = 0; i < n; i++) {
    p = photos[i];
    var bgx = Math.floor(p.x / cs);
    var bgy = Math.floor(p.y / cs);
    for (var ox = -1; ox <= 1; ox++) {
      for (var oy = -1; oy <= 1; oy++) {
        var bk = grid.get((bgx + ox) + ',' + (bgy + oy));
        if (!bk) continue;
        for (var b = 0; b < bk.length; b++) {
          j = bk[b];
          if (j <= i) continue;
          q = photos[j];
          dx = p.x - q.x;
          dy = p.y - q.y;
          d2 = dx * dx + dy * dy;
          if (d2 >= SEP2 || d2 < 0.0001) continue;
          d = Math.sqrt(d2);
          var ratio = d / SEP_RADIUS;
          var push = (1 - ratio) * SEP_K;
          /* 越贴近推得越狠：轻微错开时柔和，真正压到一起时迅速弹开 */
          if (ratio < 0.88) push *= 1 + (0.88 - ratio) * 5.5;
          var nx = dx / d, ny = dy / d;
          p.vx += nx * push * dt;
          p.vy += ny * push * dt;
          q.vx -= nx * push * dt;
          q.vy -= ny * push * dt;
        }
      }
    }
  }

  /* ---- 第三遍：波纹冲力 + 积分 + 姿态 ---- */
  var alive = [];
  for (var r = 0; r < ripples.length; r++) {
    var rp = ripples[r];
    rp.r += RIPPLE_SPEED * rp.power * dt;
    rp.life -= 0.0105 * dt;
    rp.power = 1 - rp.r / rp.maxR;
    if (rp.life > 0 && rp.power > 0) alive.push(rp);
  }
  ripples = alive;

  for (i = 0; i < n; i++) {
    p = photos[i];

    for (var r2 = 0; r2 < ripples.length; r2++) {
      var rp2 = ripples[r2];
      dx = p.x - rp2.x;
      dy = p.y - rp2.y;
      d = Math.sqrt(dx * dx + dy * dy);
      if (d < 1) { dx = 0.7; dy = 0.7; d = 1; }
      var off = Math.abs(d - rp2.r);
      if (off < RIPPLE_BAND) {
        var w = (1 - off / RIPPLE_BAND) * rp2.life * rp2.power * RIPPLE_POWER;
        p.vx += (dx / d) * w * dt;
        p.vy += (dy / d) * w * dt;
        p.spin += (dx / d) * w * 0.011 * dt;
      }
    }

    var damp = Math.pow(DRAG, dt);
    p.vx *= damp;
    p.vy *= damp;

    var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    if (sp < 0.004) { p.vx = 0; p.vy = 0; }
    if (sp > MAXV) { p.vx = p.vx / sp * MAXV; p.vy = p.vy / sp * MAXV; }

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    /* 姿态：缓慢摇摆 + 受扰自旋衰减 */
    p.spin *= Math.pow(0.955, dt);
    p.rot = p.rotBase +
            Math.sin(t * p.rotSpd + p.rotPh) * p.rotAmp +
            p.spin;
  }

  /* ---- 第四遍：位置约束求解（PBD）
     软性斥力只能"倾向于"分开，无法硬保证不重叠。
     这里直接修正位置 + 消除相互靠近的速度分量，
     做到数学上不可能出现可见重叠。 ---- */
  var MIND = cellSize * 1.06;
  var MIND2 = MIND * MIND;
  var cs2 = MIND;

  for (var iter = 0; iter < 2; iter++) {
    var g2 = new Map();
    for (i = 0; i < n; i++) {
      p = photos[i];
      var kx = Math.floor(p.x / cs2);
      var ky = Math.floor(p.y / cs2);
      var kk = kx + ',' + ky;
      var bb = g2.get(kk);
      if (!bb) { bb = []; g2.set(kk, bb); }
      bb.push(i);
    }

    for (i = 0; i < n; i++) {
      p = photos[i];
      var qx = Math.floor(p.x / cs2);
      var qy = Math.floor(p.y / cs2);
      for (var ax = -1; ax <= 1; ax++) {
        for (var ay = -1; ay <= 1; ay++) {
          var bucket2 = g2.get((qx + ax) + ',' + (qy + ay));
          if (!bucket2) continue;
          for (var c2 = 0; c2 < bucket2.length; c2++) {
            j = bucket2[c2];
            if (j <= i) continue;
            q = photos[j];
            dx = p.x - q.x;
            dy = p.y - q.y;
            d2 = dx * dx + dy * dy;
            if (d2 >= MIND2 || d2 < 0.000001) continue;

            d = Math.sqrt(d2);
            var nx2 = dx / d;
            var ny2 = dy / d;

            /* 位置修正：各退一半 */
            var corr = (MIND - d) * 0.5;
            p.x += nx2 * corr;
            p.y += ny2 * corr;
            q.x -= nx2 * corr;
            q.y -= ny2 * corr;

            /* 速度修正：抹掉沿法线相互靠近的分量，避免抖动 */
            var rel = (p.vx - q.vx) * nx2 + (p.vy - q.vy) * ny2;
            if (rel < 0) {
              var imp = rel * 0.5;
              p.vx -= nx2 * imp; p.vy -= ny2 * imp;
              q.vx += nx2 * imp; q.vy += ny2 * imp;
            }

            /* 轻微碰撞自旋，看起来像真的撞到 */
            p.spin += (dx / d) * 0.0016;
            q.spin -= (dx / d) * 0.0016;
          }
        }
      }
    }
  }
}

function emitRipple(sx, sy, power) {
  ripples.push({
    x: sx - W() / 2 - viewX,
    y: sy - H() / 2 - viewY,
    r: 6,
    maxR: Math.max(W(), H()) * (0.42 + Math.random() * 0.16),
    life: 1,
    power: power || 1
  });
  if (ripples.length > 26) ripples.shift();
}

function tick(now) {
  var t = now / 1000;
  var dt = lastT ? Math.min((now - lastT) / 16.667, 3) : 1;
  lastT = now;

  if (openIdx < 0) {
    /* 相机极缓慢漂移，让整幅画面有"整体流动"感 */
    wanderA += (Math.random() - 0.5) * 0.20 * dt;
    goalX += Math.cos(wanderA) * 0.022 * dt;
    goalY += Math.sin(wanderA) * 0.022 * dt;

    var maxX = Math.max(W() * 0.04, clusterR - W() * 0.20);
    var maxY = Math.max(H() * 0.04, clusterR - H() * 0.20);
    if (viewX > maxX) goalX -= (viewX - maxX) * 0.0026 * dt;
    if (viewX < -maxX) goalX += (-maxX - viewX) * 0.0026 * dt;
    if (viewY > maxY) goalY -= (viewY - maxY) * 0.0026 * dt;
    if (viewY < -maxY) goalY += (-maxY - viewY) * 0.0026 * dt;

    var damp = Math.pow(0.988, dt);
    goalX = clamp(goalX * damp, -2.2, 2.2);
    goalY = clamp(goalY * damp, -2.2, 2.2);

    var ease = Math.min(1, 0.05 * dt);
    velX += (goalX - velX) * ease;
    velY += (goalY - velY) * ease;

    viewX += velX * dt;
    viewY += velY * dt;

    var cd = Math.pow(0.930, dt);
    currentX *= cd;
    currentY *= cd;
    if (Math.abs(currentX) < 0.002) currentX = 0;
    if (Math.abs(currentY) < 0.002) currentY = 0;

    physics(dt, t);
  }

  render(t);
  requestAnimationFrame(tick);
}

function worldToScreen(i, t) {
  var p = photos[i];
  return { x: W() / 2 + p.x + viewX, y: H() / 2 + p.y + viewY };
}

/* ---------- 水面波纹 ---------- */
function drawRipples() {
  for (var i = 0; i < ripples.length; i++) {
    var rp = ripples[i];
    var a = rp.life * rp.life * rp.power;
    if (a <= 0.01) continue;

    var sx = rp.x + W() / 2 + viewX;
    var sy = rp.y + H() / 2 + viewY;

    /* 主波峰：径向渐变描边，形成柔和的环 */
    var g1 = ctx.createRadialGradient(sx, sy, Math.max(0, rp.r - 22), sx, sy, rp.r + 22);
    g1.addColorStop(0, 'rgba(130,205,255,0)');
    g1.addColorStop(0.5, 'rgba(175,225,255,' + (a * 0.85).toFixed(3) + ')');
    g1.addColorStop(1, 'rgba(130,205,255,0)');
    ctx.strokeStyle = g1;
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.arc(sx, sy, rp.r, 0, Math.PI * 2);
    ctx.stroke();

    /* 两道尾随的次级涟漪 */
    for (var k = 1; k <= 2; k++) {
      var rr = rp.r - k * 26;
      if (rr <= 4) continue;
      var gk = ctx.createRadialGradient(sx, sy, Math.max(0, rr - 14), sx, sy, rr + 14);
      gk.addColorStop(0, 'rgba(130,205,255,0)');
      gk.addColorStop(0.5, 'rgba(150,215,255,' + (a * 0.30 / k).toFixed(3) + ')');
      gk.addColorStop(1, 'rgba(130,205,255,0)');
      ctx.strokeStyle = gk;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(sx, sy, rr, 0, Math.PI * 2);
      ctx.stroke();
    }

    /* 中心高光，模拟落点 */
    if (rp.r < 90) {
      var g0 = ctx.createRadialGradient(sx, sy, 0, sx, sy, 70);
      g0.addColorStop(0, 'rgba(200,240,255,' + (a * 0.42 * (1 - rp.r / 90)).toFixed(3) + ')');
      g0.addColorStop(1, 'rgba(200,240,255,0)');
      ctx.fillStyle = g0;
      ctx.beginPath();
      ctx.arc(sx, sy, 70, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

/* ---------- 光标处的柔光 ---------- */
function drawCursorGlow() {
  if (!cursorIn || openIdx >= 0) return;
  var g = ctx.createRadialGradient(cursorX, cursorY, 0, cursorX, cursorY, CURSOR_R);
  g.addColorStop(0, 'rgba(150,215,255,0.11)');
  g.addColorStop(0.55, 'rgba(150,215,255,0.045)');
  g.addColorStop(1, 'rgba(150,215,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cursorX, cursorY, CURSOR_R, 0, Math.PI * 2);
  ctx.fill();
}

function render(t) {
  ctx.clearRect(0, 0, W(), H());

  /* 水面反光碎点 */
  ctx.fillStyle = 'rgba(255,255,255,0.038)';
  for (var s = 0; s < 54; s++) {
    var px = (s * 137.51 + Math.sin(t * 0.35 + s) * 40 + t * 11) % W();
    var py = (s * 251.73 + Math.cos(t * 0.29 + s * 1.7) * 34 + t * 7) % H();
    var rr = 1 + (s % 3) * 0.7;
    ctx.beginPath();
    ctx.arc(px < 0 ? px + W() : px, py < 0 ? py + H() : py, rr, 0, Math.PI * 2);
    ctx.fill();
  }

  drawRipples();
  drawCursorGlow();

  var n = photos.length;
  var margin = cellSize * 1.5;

  for (var i = 0; i < n; i++) {
    var ph = photos[i];
    var pos = worldToScreen(i, t);
    if (pos.x < -margin || pos.x > W() + margin || pos.y < -margin || pos.y > H() + margin) continue;

    var sp = makeSprite(ph);
    if (!sp) {
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, cellSize / 2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fill();
      continue;
    }

    var isHover = (i === hoverIdx);
    var scale = (isHover ? 1.11 : 1.0) * (1 + Math.sin(t * 0.9 + ph.pulsePh) * 0.012);
    var w = sp.width * scale;
    var h = sp.height * scale;

    if (isHover) {
      ctx.save();
      ctx.shadowColor = 'rgba(255,107,157,0.9)';
      ctx.shadowBlur = 38;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, (cellSize / 2 + 5) * scale, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,107,157,0.18)';
      ctx.fill();
      ctx.restore();
    }

    /* 带自转的绘制，像水面上微微打转 */
    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.rotate(ph.rot);
    ctx.drawImage(sp, -w / 2, -h / 2, w, h);
    ctx.restore();

    var likes = ph.likes;
    if (likes > 0) {
      var cosr = Math.cos(ph.rot), sinr = Math.sin(ph.rot);
      var lx = (cellSize / 2) * scale - 6;
      var ly = -(cellSize / 2) * scale + 6;
      var bx = pos.x + lx * cosr - ly * sinr;
      var by = pos.y + lx * sinr + ly * cosr;
      ctx.beginPath();
      ctx.arc(bx, by, 15, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,45,120,0.94)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.65)';
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(likes > 999 ? '999+' : String(likes), bx, by);
    }
  }
}

/* ---------- 交互 ---------- */
function hitTest(mx, my, t) {
  var best = -1;
  var bestD = Infinity;
  var rad = cellSize / 2 + 6;
  for (var i = photos.length - 1; i >= 0; i--) {
    var p = worldToScreen(i, t);
    var dx = mx - p.x;
    var dy = my - p.y;
    var d2 = dx * dx + dy * dy;
    if (d2 < rad * rad && d2 < bestD) { bestD = d2; best = i; }
  }
  return best;
}

function onDown(x, y) {
  mouseDown = true;
  downX = lastX = x;
  downY = lastY = y;
  dragVX = dragVY = 0;
  lastTrailT = 0;
  document.body.classList.add('dragging');
  noteActivity();
}

function onMove(x, y) {
  cursorX = x;
  cursorY = y;
  cursorIn = true;

  if (!mouseDown) {
    if (openIdx < 0) {
      var idx = hitTest(x, y, performance.now() / 1000);
      if (idx !== hoverIdx) {
        hoverIdx = idx;
        canvas.style.cursor = idx >= 0 ? 'pointer' : 'grab';
      }
    }
    return;
  }

  /* 拖拽 = 用手推一整片水 */
  var dx = x - lastX;
  var dy = y - lastY;
  dragVX = dx;
  dragVY = dy;

  currentX = clamp(currentX + dx * 0.34, -10, 10);
  currentY = clamp(currentY + dy * 0.34, -10, 10);

  /* 拖拽尾迹荡起小涟漪 */
  var now = performance.now();
  var spd = Math.abs(dx) + Math.abs(dy);
  if (spd > 4 && now - lastTrailT > 85) {
    lastTrailT = now;
    emitRipple(x, y, 0.34 + Math.min(spd / 60, 0.4));
  }

  lastX = x;
  lastY = y;
}

function onUp(x, y) {
  if (!mouseDown) return;
  mouseDown = false;
  document.body.classList.remove('dragging');

  var moved = Math.abs(x - downX) + Math.abs(y - downY);

  if (moved < 8) {
    var t = performance.now() / 1000;
    var idx = hitTest(x, y, t);

    if (idx >= 0) {
      openViewer(idx);
      currentX = currentY = 0;
      noteActivity();
      return;
    }

    /* 点在"水面"上：激起一组同心波纹 */
    emitRipple(x, y, 1.25);
    setTimeout(function () { if (openIdx < 0) emitRipple(x, y, 0.72); }, 130);
    setTimeout(function () { if (openIdx < 0) emitRipple(x, y, 0.42); }, 260);

    /* 同时给一个向外的整体推力 */
    var ddx = x - W() / 2;
    var ddy = y - H() / 2;
    var dl = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
    currentX = clamp(currentX - ddx / dl * 1.6, -10, 10);
    currentY = clamp(currentY - ddy / dl * 1.6, -10, 10);
  }

  dragVX = dragVY = 0;
  noteActivity();
}

canvas.addEventListener('mousedown', function (e) { onDown(e.clientX, e.clientY); });
window.addEventListener('mousemove', function (e) { onMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', function (e) { onUp(e.clientX, e.clientY); });

canvas.addEventListener('touchstart', function (e) {
  if (e.touches.length === 1) {
    onDown(e.touches[0].clientX, e.touches[0].clientY);
    e.preventDefault();
  }
}, { passive: false });

canvas.addEventListener('touchmove', function (e) {
  if (mouseDown && e.touches.length === 1) {
    onMove(e.touches[0].clientX, e.touches[0].clientY);
    e.preventDefault();
  }
}, { passive: false });

canvas.addEventListener('touchend', function (e) {
  var t0 = e.changedTouches[0];
  if (t0) onUp(t0.clientX, t0.clientY);
});

canvas.addEventListener('wheel', function (e) {
  e.preventDefault();
  currentX = clamp(currentX - e.deltaX * 0.030, -10, 10);
  currentY = clamp(currentY - e.deltaY * 0.030, -10, 10);
  noteActivity();
}, { passive: false });

canvas.addEventListener('mouseleave', function () { cursorIn = false; });
window.addEventListener('blur', function () { cursorIn = false; });

/* ---------- 放大查看 + 点赞 ---------- */
function openViewer(i) {
  openIdx = i;
  var p = photos[i];
  bigImg.src = p.src;
  bigName.textContent = p.name;
  refreshLikeUI(p);
  viewer.classList.add('open');
  goalX = goalY = velX = velY = 0;
  currentX = currentY = 0;
  cursorIn = false;
  noteActivity();
}

function closeViewer() {
  viewer.classList.remove('open');
  openIdx = -1;
  noteActivity();
}

function refreshLikeUI(p) {
  var isOn = !!liked[p.name];
  likeBtn.classList.toggle('on', isOn);
  likeBtn.querySelector('.heart').textContent = isOn ? '❤️' : '🤍';
  likeLabel.textContent = isOn ? '已点赞' : '点赞';
  likeNum.textContent = p.likes + ' ❤️';
}

function burstHearts() {
  var rect = likeBtn.getBoundingClientRect();
  var ox = rect.left + rect.width / 2;
  var oy = rect.top;
  for (var i = 0; i < 14; i++) {
    var el = document.createElement('div');
    el.className = 'floaty';
    el.textContent = HEART_EMOJI[Math.floor(Math.random() * HEART_EMOJI.length)];
    el.style.left = (ox + (Math.random() - 0.5) * 90) + 'px';
    el.style.top = (oy + (Math.random() - 0.5) * 18) + 'px';
    el.style.setProperty('--dx', ((Math.random() - 0.5) * 130).toFixed(0) + 'px');
    el.style.setProperty('--rot', ((Math.random() - 0.5) * 90).toFixed(0) + 'deg');
    el.style.animationDelay = (Math.random() * 0.22).toFixed(2) + 's';
    document.body.appendChild(el);
    (function (node) { setTimeout(function () { node.remove(); }, 1700); })(el);
  }
}

likeBtn.addEventListener('click', function () {
  if (openIdx < 0) return;
  var p = photos[openIdx];
  if (liked[p.name]) {
    liked[p.name] = false;
    p.likes = Math.max(0, p.likes - 1);
  } else {
    liked[p.name] = true;
    p.likes += 1;
    burstHearts();
  }
  refreshLikeUI(p);
  saveLikes();
  noteActivity();
});

closeBtn.addEventListener('click', closeViewer);
viewer.addEventListener('click', function (e) { if (e.target === viewer) closeViewer(); });

/* ---------- 点赞持久化 ---------- */
function collectLikes() {
  var data = {};
  for (var i = 0; i < photos.length; i++) {
    if (photos[i].likes > 0) data[photos[i].name] = photos[i].likes;
  }
  return data;
}

async function saveLikes() {
  var data = collectLikes();
  likesCache = data;

  if (!dirHandle) {
    try { localStorage.setItem('photowall-likes', JSON.stringify(data)); } catch (e) {}
    return;
  }

  try {
    var fh = await dirHandle.getFileHandle(LIKES_FILE, { create: true });
    var w = await fh.createWritable();
    await w.write(JSON.stringify(data, null, 2));
    await w.close();
  } catch (err) {
    console.warn('写入点赞文件失败，回退到 localStorage：', err);
    try { localStorage.setItem('photowall-likes', JSON.stringify(data)); } catch (e) {}
  }
}

async function readLikes(handle) {
  try {
    var fh = await handle.getFileHandle(LIKES_FILE);
    var file = await fh.getFile();
    var txt = await file.text();
    var obj = JSON.parse(txt);
    return (obj && typeof obj === 'object') ? obj : {};
  } catch (e) {
    return {};
  }
}

/* ---------- IndexedDB 句柄持久化 ---------- */
function idbOpen() {
  return new Promise(function (res, rej) {
    var req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = function () {
      if (!req.result.objectStoreNames.contains(DB_STORE)) req.result.createObjectStore(DB_STORE);
    };
    req.onsuccess = function () { res(req.result); };
    req.onerror = function () { rej(req.error); };
  });
}

async function idbPut(key, val) {
  try {
    var db = await idbOpen();
    await new Promise(function (res, rej) {
      var tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(val, key);
      tx.oncomplete = res;
      tx.onerror = function () { rej(tx.error); };
    });
    return true;
  } catch (e) { return false; }
}

async function idbGet(key) {
  try {
    var db = await idbOpen();
    return await new Promise(function (res, rej) {
      var tx = db.transaction(DB_STORE, 'readonly');
      var r = tx.objectStore(DB_STORE).get(key);
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  } catch (e) { return null; }
}

/* ---------- 目录加载 ---------- */
async function useDirectory(handle) {
  dirHandle = handle;
  emptyBox.classList.remove('show');

  likesCache = await readLikes(handle);

  var found = [];
  for await (var entry of handle.values()) {
    if (entry.kind !== 'file') continue;
    if (entry.name === LIKES_FILE) continue;
    if (!isImage(entry.name)) continue;
    found.push(entry);
  }

  if (found.length === 0) {
    photos = [];
    recomputeLayout();
    emptyBox.classList.add('show');
    dirName.textContent = handle.name + '（空）';
    idbPut(DB_KEY, handle);
    return;
  }

  for (var j = 0; j < photos.length; j++) {
    if (!photos[j].isDemo && photos[j].src) {
      try { URL.revokeObjectURL(photos[j].src); } catch (e) {}
    }
  }

  found.sort(function (a, b) { return a.name.localeCompare(b.name, 'zh-Hans-CN'); });

  photos = [];
  var id = 0;
  for (var k = 0; k < found.length; k++) {
    var fh = found[k];
    var f = await fh.getFile();
    var nm = baseName(f.name);
    var ph = {
      id: 'f' + (id++),
      name: nm,
      src: URL.createObjectURL(f),
      img: null,
      likes: likesCache[nm] || 0,
      isDemo: false,
      fileHandle: fh
    };
    photos.push(ph);
    loadImg(ph);
  }

  liked = {};
  sprites.clear();
  recomputeLayout();
  viewX = viewY = velX = velY = goalX = goalY = 0;
  rot = 0;

  dirName.textContent = handle.name + ' · ' + photos.length + ' 张';
  dirName.title = handle.name;
  restoreBar.classList.remove('show');

  await idbPut(DB_KEY, handle);
  noteActivity();
}

function loadImg(ph) {
  var img = new Image();
  img.decoding = 'async';
  img.onload = function () { ph.img = img; };
  img.onerror = function () { console.warn('图片读取失败:', ph.name); };
  img.src = ph.src;
  ph.img = img;
}

/* ---------- 选择目录 ---------- */
async function pickDirectory() {
  if (!window.showDirectoryPicker) {
    alert('当前浏览器不支持「文件系统访问 API」。请使用 Chrome 或 Edge 打开本页面；此时页面会以内置演示照片运行。');
    return;
  }
  try {
    var handle = await window.showDirectoryPicker({ mode: 'readwrite', id: 'photowall' });
    await useDirectory(handle);
  } catch (err) {
    if (err && err.name !== 'AbortError') console.error('选择目录失败:', err);
  }
}

pickBtn.addEventListener('click', pickDirectory);
emptyPick.addEventListener('click', pickDirectory);

/* ---------- 恢复上次目录 ---------- */
async function tryRestore() {
  var handle = await idbGet(DB_KEY);
  if (!handle) return false;
  try {
    var perm = await handle.queryPermission({ mode: 'readwrite' });
    if (perm === 'granted') {
      await useDirectory(handle);
      return true;
    }
    pendingHandle = handle;
    restoreName.textContent = '「' + handle.name + '」';
    restoreBar.classList.add('show');
    return false;
  } catch (e) {
    return false;
  }
}

restoreBtn.addEventListener('click', async function () {
  if (!pendingHandle) return;
  try {
    var perm = await pendingHandle.requestPermission({ mode: 'readwrite' });
    if (perm === 'granted') {
      await useDirectory(pendingHandle);
    } else {
      restoreBar.classList.remove('show');
    }
  } catch (e) { console.error(e); }
});

restoreNo.addEventListener('click', function () {
  restoreBar.classList.remove('show');
  pendingHandle = null;
});

/* ---------- 全屏 / UI 自动隐藏 ---------- */
function toggleFull() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(function () {});
  } else {
    document.exitFullscreen();
  }
}
fullBtn.addEventListener('click', toggleFull);

function noteActivity() {
  if (uiHidden) {
    uiHidden = false;
    topbar.classList.remove('hidden');
    hint.classList.remove('fade');
  }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(function () {
    if (openIdx >= 0) return;
    uiHidden = true;
    topbar.classList.add('hidden');
    hint.classList.add('fade');
  }, 9000);
}

window.addEventListener('mousemove', noteActivity, { passive: true });

/* ---------- 键盘 ---------- */
window.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && openIdx >= 0) { closeViewer(); return; }
  if (e.key === 'f' || e.key === 'F') { toggleFull(); return; }
  if (openIdx >= 0) return;
  var step = 3.2;
  if (e.key === 'ArrowLeft') { currentX -= step; noteActivity(); }
  if (e.key === 'ArrowRight') { currentX += step; noteActivity(); }
  if (e.key === 'ArrowUp') { currentY -= step; noteActivity(); }
  if (e.key === 'ArrowDown') { currentY += step; noteActivity(); }
  if (e.key === ' ') { emitRipple(W() / 2, H() / 2, 1.3); e.preventDefault(); noteActivity(); }
});

/* ---------- 演示照片 ---------- */
var DEMO_NAMES = [
  '张可爱', '李晓明', '王小花', '赵阳光', '陈星星', '刘月亮',
  '周彩虹', '吴糖果', '郑温暖', '钱多多', '孙甜甜', '杨乐乐',
  '黄美美', '许欢欢', '林佳佳', '何宝宝', '吕萌萌', '施俏俏',
  '张晨曦', '孔小鹿', '曹云朵', '严晴天', '华美琳', '金闪闪',
  '魏星宇', '陶思思', '姜小鱼', '戚小可', '谢如意', '邹幸运'
];

var DEMO_COLORS = [
  ['#FF9A9E', '#FAD0C4'], ['#A18CD1', '#FBC2EB'], ['#FBC2EB', '#A6C1EE'],
  ['#84FAB0', '#8FD3F4'], ['#FFD26F', '#FF9A8B'], ['#A1C4FD', '#C2E9FB'],
  ['#FFAFBD', '#FFC3A0'], ['#96E6A1', '#D4FC79'], ['#F6D365', '#FDA085'],
  ['#5EE7DF', '#B490CA'], ['#C1DFC4', '#DEECDD'], ['#FF9A9E', '#FECFEF'],
  ['#F093FB', '#F5576C'], ['#4FACFE', '#00F2FE'], ['#43E97B', '#38F9D7'],
  ['#FA709A', '#FEE140'], ['#30CFD0', '#330867'], ['#A8EDEA', '#FED6E3'],
  ['#FF6B9D', '#C44EFF'], ['#4ECDC4', '#44A08D']
];

var DEMO_EMOJI = ['😊', '🌟', '💖', '🎀', '🌸', '✨', '🍬', '🌈', '💫', '🦋',
                  '🎨', '🍭', '💎', '🌺', '⭐', '🐣', '🍀', '🎈', '🧸', '🌻'];

function mulberry(seed) {
  return function () {
    seed = (seed + 0x6D2B79F5) & 0x7fffffff;
    var t = seed;
    t = (t ^ (t >>> 15)) * (t | 1) & 0x7fffffff;
    t = (t + ((t ^ (t >>> 7)) * (t | 61) & 0x7fffffff)) & 0x7fffffff;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeDemoPhoto(name, i) {
  var cv = document.createElement('canvas');
  cv.width = cv.height = 360;
  var g = cv.getContext('2d');
  var pal = DEMO_COLORS[i % DEMO_COLORS.length];
  var rnd = mulberry(i * 7919 + 13);

  var grd = g.createLinearGradient(0, 0, 360, 360);
  grd.addColorStop(0, pal[0]);
  grd.addColorStop(1, pal[1]);
  g.fillStyle = grd;
  g.fillRect(0, 0, 360, 360);

  for (var b = 0; b < 9; b++) {
    g.beginPath();
    g.arc(rnd() * 360, rnd() * 360, 14 + rnd() * 62, 0, Math.PI * 2);
    g.fillStyle = 'rgba(255,255,255,' + (0.05 + rnd() * 0.13).toFixed(3) + ')';
    g.fill();
  }

  g.beginPath();
  g.arc(180, 172, 96, 0, Math.PI * 2);
  g.fillStyle = 'rgba(255,255,255,0.20)';
  g.fill();

  g.font = '128px serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(DEMO_EMOJI[i % DEMO_EMOJI.length], 180, 172);

  var img = new Image();
  img.src = cv.toDataURL('image/png');
  return img;
}

function loadDemoPhotos() {
  likesCache = {};
  try {
    var stored = localStorage.getItem('photowall-likes');
    if (stored) likesCache = JSON.parse(stored) || {};
  } catch (e) {}

  photos = DEMO_NAMES.map(function (nm, i) {
    var img = makeDemoPhoto(nm, i);
    return {
      id: 'd' + i,
      name: nm,
      src: img.src,
      img: img,
      likes: likesCache[nm] || 0,
      isDemo: true,
      fileHandle: null
    };
  });

  dirName.textContent = '演示照片 · ' + photos.length + ' 张';
  dirName.title = '点击左侧按钮选择你自己的照片目录';
  recomputeLayout();
}

/* ---------- 启动 ---------- */
async function init() {
  await new Promise(function (res) {
    var done = false;
    var fin = function () { if (!done) { done = true; res(); } };
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fin).catch(fin);
      setTimeout(fin, 2600);
    } else { fin(); }
  });

  loadDemoPhotos();
  resize();

  ready = true;
  requestAnimationFrame(tick);
  noteActivity();

  await tryRestore();
}

init();
